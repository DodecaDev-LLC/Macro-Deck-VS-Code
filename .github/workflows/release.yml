name: Release

# Publishing a GitHub release builds, tests and uploads the plugin to the Creator Portal, which signs it
# after review. The release tag sets the version (v1.0.0 -> 1.0.0); manifest.json's version is replaced.
# The same release also runs vscode-extension.yml, which attaches the matching .vsix to the release.
on:
  release:
    types: [published]

jobs:
  publish:
    uses: Macro-Deck-App/GitHub-Actions/.github/workflows/publish-plugin.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      version: ${{ github.event.release.tag_name }}
      source: src/DodecaDev.VsCode
      changelog: ${{ github.event.release.body }}
      # Pinned: the default ("newest prerelease") has resolved to a CLI below the Store's minimum.
      # Keep it at or above minimumCliVersion from
      # https://api.macro-deck.app/api/v1/public/dependency-policy/sdk
      cli-version: 3.0.0-beta.16
      # Keep the built .macroDeckPlugin on the run too, for testing a release before review finishes.
      upload-artifact: true
